[package]
name = "cmspark-quant"
version = "0.1.0"
edition = "2021"
authors = ["nehcuh"]
description = "CMspark Quant Strategy Discovery & Sandbox Dashboard Prototype (Rust + GPUI Kit)"
license = "MIT"

[dependencies]
gpui-kit = "0.7.3"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
