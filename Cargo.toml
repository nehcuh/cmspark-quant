[workspace]
resolver = "2"
members = ["crates/cmsq-core", "crates/cmsq-cli", "crates/cmsq-dashboard"]
default-members = ["crates/cmsq-core", "crates/cmsq-cli"]
exclude = ["third_party/rstdx"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["胡琛 <curiousbull@outlook.com>"]

[profile.dev]
debug = 0
[profile.dev.package."*"]
opt-level = 1
