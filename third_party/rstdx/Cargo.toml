# Vendored from https://github.com/huchen/rstdx (local branch fix/managed-import @ 009b78c)
# Trimmed: library only (no CLI bin, no python/polars bindings, no benches).
# Local fixes vs upstream:
#   - 77629df  import ManagedTdxClient via public re-export (upstream did not compile)
#   - 009b78c  security_bars: empty / header-only body => 0 bars (was "Buffer too short")
[package]
name = "rstdx"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
autobins = false
autobenches = false
autoexamples = false
autotests = false

[lib]
name = "rstdx"

[dependencies]
tokio = { version = "1", features = ["net", "time", "sync", "macros", "io-util", "rt-multi-thread"] }
bytes = "1"
flate2 = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
encoding_rs = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"

[lints.rust]
unexpected_cfgs = "allow"

[dev-dependencies]
proptest = "1"
tokio-test = "0.4"
