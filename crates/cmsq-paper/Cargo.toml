[package]
name = "cmsq-paper"
description = "Host-side trusted paper-trading matcher (simulated fills against exchange quotes; no order path to any broker)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Deliberately no network, broker or CTP dependency: see tests/no_order_path.rs.
[dependencies]
cmsq-core = { path = "../cmsq-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[dev-dependencies]
chrono = "0.4"
