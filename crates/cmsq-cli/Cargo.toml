[package]
name = "cmsq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cmsq"
path = "src/main.rs"

[features]
default = ["tdx"]
tdx = ["cmsq-core/tdx"]
llm = ["cmsq-core/llm"]

[dependencies]
cmsq-core = { path = "../cmsq-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
