# Independently deployed persistence for cmsq: PostgreSQL 16 + TimescaleDB.
# Bring up with scripts/db_up.sh (generates passwords into the secrets dir,
# outside any workspace, and writes the connection URLs to <secrets>/db.env).
# Listens on 127.0.0.1 only. Two roles:
#   cmsq_owner  owns the schema, runs migrations (`cmsq db migrate`)
#   cmsq_app    runtime role: INSERT/SELECT only on audit/trials/signals/evaluations,
#               no UPDATE/DELETE/TRUNCATE, cannot drop the append-only triggers
name: cmsq
services:
  db:
    image: timescale/timescaledb@sha256:${CMSQ_PG_IMAGE_DIGEST:-6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f}
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmsq_owner
      POSTGRES_DB: cmsq
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_owner_pw
      CMSQ_APP_PASSWORD_FILE: /run/secrets/pg_app_pw
      TIMESCALEDB_TELEMETRY: "off"
    secrets: [pg_owner_pw, pg_app_pw]
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "timescaledb.telemetry_level=off",
              "-c", "log_statement=ddl", "-c", "password_encryption=scram-sha-256"]
    ports: ["127.0.0.1:${CMSQ_PG_PORT:-55432}:5432"]
    volumes:
      - cmsq-pg:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmsq_owner -d cmsq"]
      interval: 2s
      timeout: 3s
      retries: 30
    shm_size: 256mb
  # Audit signer (DEFAULT audit-key mode): the key lives only in the cmsq-signer volume, owned
  # by uid 10001. The socket is bind-mounted to the host (${CMSQ_RUN_DIR}/sock); the host app
  # sets CMSQ_AUDIT_SIGNER to it. Only the host uid in --allow-uid may connect (SO_PEERCRED).
  # No network at all. Chains must be enrolled explicitly (deploy.sh does it).
  signer:
    build:
      context: ${CMSQ_SIGNER_CONTEXT:-./.signer-build}
      dockerfile: Dockerfile.signer
    image: cmsq-signer:local
    restart: unless-stopped
    user: "10001:${CMSQ_HOST_GID:?set by scripts/deploy.sh}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["signer", "serve", "--dir", "/var/lib/cmsq-signer", "--socket", "/run/cmsq-signer/sock",
              "--allow-uid", "${CMSQ_HOST_UID:?set by scripts/deploy.sh},10001"]
    volumes:
      - cmsq-signer:/var/lib/cmsq-signer
      - ${CMSQ_RUN_DIR:?set by scripts/deploy.sh}:/run/cmsq-signer
    healthcheck:
      test: ["CMD", "/usr/local/bin/cmsq", "signer", "ping", "--socket", "/run/cmsq-signer/sock"]
      interval: 2s
      timeout: 3s
      retries: 30
  # OPTIONAL hot layer (quote cache, pub/sub, distributed rate limits). Ephemeral by design:
  # no persistence, nothing of record. Opt in with `scripts/deploy.sh --hot` (profile "hot").
  redis:
    profiles: ["hot"]
    image: redis@sha256:${CMSQ_REDIS_IMAGE_DIGEST:-858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499}
    restart: unless-stopped
    secrets: [redis_pw]
    entrypoint: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_pw)\" --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru --rename-command FLUSHALL '' --rename-command CONFIG ''"]
    ports: ["127.0.0.1:${CMSQ_REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_pw)\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
secrets:
  pg_owner_pw:
    file: ${CMSQ_SECRETS_DIR:?}/pg_owner_pw
  pg_app_pw:
    file: ${CMSQ_SECRETS_DIR:?}/pg_app_pw
  redis_pw:
    file: ${CMSQ_SECRETS_DIR:?}/redis_pw
volumes:
  cmsq-pg:
  cmsq-signer:
